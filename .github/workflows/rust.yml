name: Rust
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install system libs
      run: sudo apt update && sudo apt install -y pkg-config libfontconfig-dev libasound2-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb-xkb-dev
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose

